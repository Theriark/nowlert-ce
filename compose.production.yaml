name: nowlert-ce

services:
  nowlert-ce:
    image: "${NOWLERT_IMAGE:-theriark/nowlert-ce:3.1.2}"
    container_name: nowlert-ce
    restart: unless-stopped
    init: true
    stop_grace_period: 20s

    # Run with the deployment user's numeric identity. The mounted config and
    # logs directories must be writable by this UID/GID.
    user: "${NOWLERT_UID:-1000}:${NOWLERT_GID:-1000}"

    ports:
      - "${NOWLERT_SMTP_PORT:-8025}:8025"
      - "${NOWLERT_HTTP_PORT:-18080}:8080"

    environment:
      TZ: "${TZ:-Europe/Lisbon}"

      NOWLERT_STATE_DIR: "/nowlert/state"

      NOWLERT_SMTP_PASSWORD: "${NOWLERT_SMTP_PASSWORD:-}"

      NOWLERT_ADMIN_TOKEN: "${NOWLERT_ADMIN_TOKEN:-}"

      NOWLERT_HARDWARE_TOKEN: "${NOWLERT_HARDWARE_TOKEN:-}"

      NOWLERT_AVAILABLE_VERSION: "${NOWLERT_AVAILABLE_VERSION:-}"

    volumes:
      - "${NOWLERT_CONFIG_DIR:-./config}:/nowlert/config"
      - "${NOWLERT_LOG_DIR:-./logs}:/nowlert/logs"
      - "${NOWLERT_SECRETS_DIR:-./secrets}:/run/secrets:ro"
      - "${NOWLERT_STATE_DIR:-./state}:/nowlert/state"

      # This remains the safest backup mode: mount NFS/SMB on the host and
      # bind it here. The managed-backups override is available when Nowlert
      # must manage remote mounts itself.
      - "${NOWLERT_EXTERNAL_BACKUP_DIR:-./external-backups}:/nowlert/external-backups"

    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
