# Compatibility filename: NAS shares are now mounted on the Docker host.
# Set NOWLERT_EXTERNAL_BACKUP_DIR to the dedicated, already-mounted NAS directory.
services:
  nowlert-ce:
    user: "${NOWLERT_UID:-1000}:${NOWLERT_GID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: "${NOWLERT_EXTERNAL_BACKUP_DIR:?Set the host-mounted NAS directory}"
        target: /nowlert/external-backups
        bind:
          create_host_path: false
