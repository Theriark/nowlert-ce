# Development-only Compose file. Run it from the repository checkout on DEVELOPMENT-HOST.
services:
  nowlert-ce-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: nowlert-ce-dev:local
    container_name: nowlert-ce-dev
    restart: unless-stopped
    working_dir: /nowlert
    ports:
      - "8026:8025"
      - "18082:8080"
    volumes:
      - .:/nowlert
    environment:
      TZ: Europe/Lisbon
    command: /nowlert/start.sh
    init: true
    stop_grace_period: 20s
