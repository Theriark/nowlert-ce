name: Promote CE to Stage

on:
  workflow_dispatch:
    inputs:
      ce_image:
        description: "Immutable CE image including @sha256 digest"
        required: true
        type: string
      source_commit:
        description: "Original full source commit SHA for the image"
        required: true
        type: string
      change_reference:
        description: "PR, issue, or release reference"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: nowlert-ce-stage-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Promote CE immutable image to Stage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: stage

    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      PROMOTION_IMAGE: ${{ inputs.ce_image }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      CE_STAGE_APPLICATION_ID: D0aI55MKe3G77LFdQcPdY

    steps:
      - name: Checkout pipeline code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify CE Stage configuration
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "${DOKPLOY_URL}" ]] || {
            echo "::error::DOKPLOY_URL is missing"
            exit 1
          }

          [[ -n "${DOKPLOY_API_KEY}" ]] || {
            echo "::error::DOKPLOY_API_KEY is missing"
            exit 1
          }

          [[ "${PROMOTION_IMAGE}" =~ ^ghcr\.io/theriark/nowlert-ce@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::CE image must be an immutable nowlert-ce digest"
            exit 1
          }

          [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Source commit must be a full lowercase 40-character SHA"
            exit 1
          }

          git cat-file -e "${SOURCE_COMMIT}^{commit}" || {
            echo "::error::Source commit does not exist in this repository"
            exit 1
          }

          [[ "${GITHUB_REF}" == "refs/heads/development" ]] || {
            echo "::error::Stage promotion must be launched from development"
            exit 1
          }

          git fetch origin \
            +refs/heads/development:refs/remotes/origin/development

          DEVELOPMENT_SHA="$(git rev-parse refs/remotes/origin/development)"

          [[ "${SOURCE_COMMIT}" == "${DEVELOPMENT_SHA}" ]] || {
            echo "::error::Stage source ${SOURCE_COMMIT} is not current development ${DEVELOPMENT_SHA}"
            exit 1
          }

      - name: Checkout candidate source for the full gate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
          path: candidate

      - name: Set up Python for the full gate
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: candidate/requirements-dev.txt

      - name: Install full-gate dependencies
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      # The complete automated suite runs in a fresh network namespace with
      # no default route and no global address. Loopback stays available for
      # local mocks/sinks, while real Discord/Teams/SMTP/webhook delivery is
      # impossible at the kernel network boundary.
      - name: Run full notification-silent CE Stage gate
        id: full_gate
        shell: bash
        run: |
          set -euo pipefail

          CANDIDATE_PATH="${GITHUB_WORKSPACE}/candidate"
          PYTHON_BIN="$(command -v python)"
          BASH_BIN="$(command -v bash)"
          IP_BIN="$(command -v ip)"
          UNSHARE_BIN="$(command -v unshare)"

          sudo env -i \
            PATH="${PATH}" \
            CANDIDATE_PATH="${CANDIDATE_PATH}" \
            PYTHON_BIN="${PYTHON_BIN}" \
            BASH_BIN="${BASH_BIN}" \
            IP_BIN="${IP_BIN}" \
            "${UNSHARE_BIN}" --net -- "${BASH_BIN}" -c '
              set -euo pipefail
              "${IP_BIN}" link set lo up
              if "${IP_BIN}" route show default | grep -q .; then
                echo "::error::Promotion gate network namespace has a default route"
                exit 1
              fi
              if "${IP_BIN}" -o addr show scope global | grep -q .; then
                echo "::error::Promotion gate network namespace has a global address"
                exit 1
              fi
              echo "PASS: promotion gate network namespace has no default route"
              cd "${CANDIDATE_PATH}"
              "${PYTHON_BIN}" -m pytest -q
              echo "STAGE CE SILENT FULL GATE PASSED"
            '

      - name: Promote CE to Stage
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_VERSION="$(
            git show "${SOURCE_COMMIT}:src/version.py" |
              sed -n 's/^VERSION = "\([^"[:space:]]*\)"$/\1/p'
          )"
          [[ -n "${EXPECTED_VERSION}" ]] || {
            echo "::error::Could not determine version for ${SOURCE_COMMIT}"
            exit 1
          }

          python .github/scripts/dokploy_release.py deploy \
            --application-id "${CE_STAGE_APPLICATION_ID}" \
            --image "${PROMOTION_IMAGE}" \
            --health-url https://ce-stage.nowlert.theriark.com/api/health \
            --expected-version "${EXPECTED_VERSION}" \
            --title "CE Stage promotion ${{ github.run_id }}" \
            --description "${{ inputs.change_reference }}" \
            --noop-ok

      # Live-environment verification is read-only. Functional delivery paths
      # were already exercised inside the network-isolated full gate above.
      - name: Run notification-silent CE Stage promotion smoke
        id: silent_smoke
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_VERSION="$(
            git show "${SOURCE_COMMIT}:src/version.py" |
              sed -n 's/^VERSION = "\([^"[:space:]]*\)"$/\1/p'
          )"

          python .github/scripts/dokploy_release.py promotion-smoke \
            --application-id "${CE_STAGE_APPLICATION_ID}" \
            --image "${PROMOTION_IMAGE}" \
            --health-url https://ce-stage.nowlert.theriark.com/api/health \
            --expected-version "${EXPECTED_VERSION}" \
            --success-marker "STAGE CE SILENT PROMOTION SMOKE PASSED"

      - name: Configure AWS credentials for CE ledger
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::845958214943:role/GitHubActions-NowlertCE-LedgerWriter
          aws-region: eu-west-1
          role-session-name: nowlert-ce-stage-${{ github.run_id }}
          role-duration-seconds: 900
          allowed-account-ids: "845958214943"
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Record CE Stage desired state
        id: ledger
        shell: bash
        run: |
          set -euo pipefail

          python .github/scripts/ledger.py current \
            --environment stage \
            --image "${PROMOTION_IMAGE}" \
            --source-commit "${SOURCE_COMMIT}" \
            --promotion-run "${GITHUB_RUN_ID}" \
            --application-id "${CE_STAGE_APPLICATION_ID}" \
            --evidence-type silent-promotion-smoke \
            --health-url https://ce-stage.nowlert.theriark.com/api/health \
            --success-marker "STAGE CE SILENT PROMOTION SMOKE PASSED"

      - name: Advance Stage source branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          CURRENT_STAGE_SHA="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/stage" \
              --jq '.object.sha'
          )"

          if [[ "${CURRENT_STAGE_SHA}" != "${SOURCE_COMMIT}" ]]; then
            COMPARE="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/compare/${CURRENT_STAGE_SHA}...${SOURCE_COMMIT}"
            )"
            STATUS="$(jq -r '.status' <<<"${COMPARE}")"
            BEHIND_BY="$(jq -r '.behind_by' <<<"${COMPARE}")"

            [[ "${BEHIND_BY}" == "0" && "${STATUS}" == "ahead" ]] || {
              echo "::error::stage cannot fast-forward from ${CURRENT_STAGE_SHA} to ${SOURCE_COMMIT} (status=${STATUS}, behind_by=${BEHIND_BY})"
              exit 1
            }

            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/stage" \
              -f sha="${SOURCE_COMMIT}" \
              -F force=false \
              >/dev/null
          fi

          STAGE_SHA=""
          for attempt in {1..15}; do
            STAGE_SHA="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/git/ref/heads/stage" \
                --jq '.object.sha'
            )"

            if [[ "${STAGE_SHA}" == "${SOURCE_COMMIT}" ]]; then
              break
            fi

            echo "Waiting for stage ref propagation (${attempt}/15): ${STAGE_SHA}"
            sleep 2
          done

          [[ "${STAGE_SHA}" == "${SOURCE_COMMIT}" ]] || {
            echo "::error::stage branch is ${STAGE_SHA}, expected ${SOURCE_COMMIT}"
            exit 1
          }

          echo "Stage branch now references ${STAGE_SHA}"

      - name: Record successful CE Stage promotion
        shell: bash
        run: |
          {
            echo "## CE Stage promotion passed"
            echo
            echo "- CE image: \`${PROMOTION_IMAGE}\`"
            echo "- Source commit: \`${SOURCE_COMMIT}\`"
            echo "- Change reference: ${{ inputs.change_reference }}"
            echo "- Full notification-silent gate: passed"
            echo "- Gate network: isolated namespace, no default route or global address"
            echo "- Live Stage verification: read-only passive smoke passed"
            echo "- External notification delivery during promotion: disabled"
            echo "- Ledger key: \`${{ steps.ledger.outputs.key }}\`"
            echo "- Ledger version: \`${{ steps.ledger.outputs.version_id }}\`"
            echo "- Rebuild performed: no"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Roll back CE after a failed Stage gate
        if: ${{ (steps.deploy.outcome == 'failure' || steps.silent_smoke.outcome == 'failure') && steps.deploy.outputs.previous_image != '' }}
        continue-on-error: true
        shell: bash
        run: |
          python .github/scripts/dokploy_release.py deploy \
            --application-id "${CE_STAGE_APPLICATION_ID}" \
            --image "${{ steps.deploy.outputs.previous_image }}" \
            --health-url https://ce-stage.nowlert.theriark.com/api/health \
            --title "Automatic CE Stage rollback ${{ github.run_id }}" \
            --description "The CE Stage promotion or silent smoke gate failed" \
            --allow-mutable \
            --noop-ok
