name: Promote CE to Stage

run-name: "Promote CE to Stage${{ inputs.dry_run && ' (dry run)' || '' }}"

# One button, run from development (Gate 2 approval runs it with no inputs).
# It promotes exactly the commit and image the CE Development application runs:
# full test suite, next annotated v<version>-rc.N tag, registry candidate tag on
# the same digest, Stage deployment of that digest, health and version check,
# then stage fast-forwards to that commit. It never rebuilds. dry_run performs
# every read and check, including the test suite, and changes nothing.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check everything and change nothing"
        required: false
        default: false
        type: boolean

# contents: write creates the candidate tag and advances stage. packages: write
# adds the candidate tag to the existing image. actions: read finds the
# Development CI run.
permissions:
  contents: write
  actions: read
  packages: write

# Shared with release.yml so the repository never runs two promotion or release
# jobs at once. A live deployment is never cancelled.
concurrency:
  group: nowlert-ce-stage-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Promote CE Development to Stage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: stage

    # GH_TOKEN is deliberately not set here: only the steps that call gh get it.
    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      IMAGE_REPOSITORY: ghcr.io/theriark/nowlert-ce
      CE_DEVELOPMENT_APPLICATION_ID: ivj7Ixgw2cP29g6riR2AH
      CE_DEVELOPMENT_HEALTH_URL: https://ce-dev-nowlert.theriark.dev/api/health
      CE_STAGE_APPLICATION_ID: x9zOew6dmrn-jmcnFbllk
      CE_STAGE_HEALTH_URL: https://ce-stg-nowlert.theriark.dev/api/health

    steps:
      - name: Checkout pipeline code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify launch branch and Stage configuration
        shell: bash
        run: |
          set -euo pipefail

          [[ "${GITHUB_REF}" == "refs/heads/development" ]] || {
            echo "::error::Stage promotion must be launched from development; received ${GITHUB_REF}"
            exit 1
          }
          for name in DOKPLOY_URL DOKPLOY_API_KEY CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET; do
            [[ -n "${!name}" ]] || {
              echo "::error::${name} is missing"
              exit 1
            }
          done
          echo "Dry run: ${DRY_RUN}"

      - name: Read the commit Development runs
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          DEVELOPMENT_IMAGE="$(
            python .github/scripts/dokploy_release.py current-image \
              --application-id "${CE_DEVELOPMENT_APPLICATION_ID}"
          )"
          SHA_TAG_PATTERN='^ghcr\.io/theriark/nowlert-ce:sha-([0-9a-f]{40})$'
          [[ "${DEVELOPMENT_IMAGE}" =~ ${SHA_TAG_PATTERN} ]] || {
            echo "::error::Development runs ${DEVELOPMENT_IMAGE}, not an immutable sha-<commit> image"
            exit 1
          }
          SOURCE_COMMIT="${BASH_REMATCH[1]}"
          echo "Development runs ${DEVELOPMENT_IMAGE} (commit ${SOURCE_COMMIT})"

          git fetch --force --tags origin \
            +refs/heads/development:refs/remotes/origin/development \
            +refs/heads/stage:refs/remotes/origin/stage
          DEVELOPMENT_SHA="$(git rev-parse refs/remotes/origin/development)"
          STAGE_BEFORE="$(git rev-parse refs/remotes/origin/stage)"

          git cat-file -e "${SOURCE_COMMIT}^{commit}" || {
            echo "::error::Commit ${SOURCE_COMMIT} does not exist in this repository"
            exit 1
          }
          git merge-base --is-ancestor "${SOURCE_COMMIT}" refs/remotes/origin/development || {
            echo "::error::Development commit ${SOURCE_COMMIT} is not part of development ${DEVELOPMENT_SHA}"
            exit 1
          }
          # Stage only moves forward: it must be the source itself or behind it.
          git merge-base --is-ancestor refs/remotes/origin/stage "${SOURCE_COMMIT}" || {
            echo "::error::Stage branch ${STAGE_BEFORE} is not an ancestor of source ${SOURCE_COMMIT}; Stage is already ahead of or diverged from Development"
            exit 1
          }

          EXPECTED_VERSION="$(
            git show "${SOURCE_COMMIT}:src/version.py" |
              sed -n 's/^VERSION = "\([^"[:space:]]*\)"$/\1/p'
          )"
          [[ -n "${EXPECTED_VERSION}" ]] || {
            echo "::error::Could not determine the application version of ${SOURCE_COMMIT}"
            exit 1
          }
          python .github/scripts/dokploy_release.py health \
            --health-url "${CE_DEVELOPMENT_HEALTH_URL}" \
            --expected-version "${EXPECTED_VERSION}"

          # The image was built and deployed by a successful push CI run of
          # exactly this commit on development.
          DEVELOPMENT_RUN_ID="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=development&event=push&status=success&head_sha=${SOURCE_COMMIT}&per_page=1" \
              --jq '.workflow_runs[0].id // empty'
          )"
          [[ "${DEVELOPMENT_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::No successful push CI run of ${SOURCE_COMMIT} on development"
            exit 1
          }
          RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DEVELOPMENT_RUN_ID}")"
          [[ "$(jq -r '.path' <<<"${RUN}")" == ".github/workflows/ci.yml" \
            && "$(jq -r '.event' <<<"${RUN}")" == "push" \
            && "$(jq -r '.head_branch' <<<"${RUN}")" == "development" \
            && "$(jq -r '.conclusion' <<<"${RUN}")" == "success" \
            && "$(jq -r '.head_sha' <<<"${RUN}")" == "${SOURCE_COMMIT}" ]] || {
            echo "::error::Run ${DEVELOPMENT_RUN_ID} is not a successful push CI run of ${SOURCE_COMMIT} on development"
            exit 1
          }

          {
            echo "source_commit=${SOURCE_COMMIT}"
            echo "development_sha=${DEVELOPMENT_SHA}"
            echo "stage_before=${STAGE_BEFORE}"
            echo "expected_version=${EXPECTED_VERSION}"
            echo "development_run_id=${DEVELOPMENT_RUN_ID}"
          } >> "${GITHUB_OUTPUT}"
          echo "PASS: Development runs ${SOURCE_COMMIT} (version ${EXPECTED_VERSION}, CI run ${DEVELOPMENT_RUN_ID})"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the immutable image digest
        id: image
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
        run: |
          set -euo pipefail

          # The digest of an image is the SHA-256 of its raw manifest.
          SHA_TAG="${IMAGE_REPOSITORY}:sha-${SOURCE_COMMIT}"
          IMAGE_DIGEST="sha256:$(
            docker buildx imagetools inspect "${SHA_TAG}" --raw |
              sha256sum |
              awk '{print $1}'
          )"
          BY_DIGEST="sha256:$(
            docker buildx imagetools inspect "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" --raw |
              sha256sum |
              awk '{print $1}'
          )"
          [[ "${BY_DIGEST}" == "${IMAGE_DIGEST}" ]] || {
            echo "::error::${IMAGE_REPOSITORY}@${IMAGE_DIGEST} resolved to ${BY_DIGEST}"
            exit 1
          }

          {
            echo "image_digest=${IMAGE_DIGEST}"
            echo "promotion_image=${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          } >> "${GITHUB_OUTPUT}"
          echo "PASS: ${SHA_TAG} is ${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"

      - name: Compute the release candidate tag
        id: rc
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
        run: |
          set -euo pipefail

          CHOICE="$(
            python .github/scripts/release_tags.py next-rc \
              --commit "${SOURCE_COMMIT}" \
              --digest "${IMAGE_DIGEST}"
          )"
          RC_TAG="$(jq -r '.rcTag' <<<"${CHOICE}")"
          RC_REUSE="$(jq -r '.reuse' <<<"${CHOICE}")"
          RC_TAG_PATTERN='^v27\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[1-9][0-9]*$'
          [[ "${RC_TAG}" =~ ${RC_TAG_PATTERN} ]] || {
            echo "::error::Computed candidate tag ${RC_TAG} is not v27.<minor>.<patch>-rc.<number>"
            exit 1
          }

          # A new tag name must be free on GitHub, not only in this checkout.
          if [[ "${RC_REUSE}" == "false" ]] &&
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RC_TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${RC_TAG} already exists on GitHub; re-run after the checkout sees it"
            exit 1
          fi

          {
            echo "rc_tag=${RC_TAG}"
            echo "rc_reuse=${RC_REUSE}"
          } >> "${GITHUB_OUTPUT}"
          if [[ "${RC_REUSE}" == "true" ]]; then
            echo "PASS: candidate ${RC_TAG} already seals ${SOURCE_COMMIT} and ${IMAGE_DIGEST}; it is reused"
          else
            echo "PASS: next candidate tag is ${RC_TAG}"
          fi

      - name: Checkout candidate source for the full gate
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.source_commit }}
          path: candidate
          persist-credentials: false

      - name: Set up Python for the full gate
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: candidate/requirements-dev.txt

      - name: Install full-gate dependencies
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      # The complete automated suite runs in a fresh network namespace with
      # no default route and no global address. Loopback stays available for
      # local mocks/sinks, while real Discord/Teams/SMTP/webhook delivery is
      # impossible at the kernel network boundary.
      - name: Run full notification-silent CE Stage gate
        id: full_gate
        shell: bash
        run: |
          set -euo pipefail

          CANDIDATE_PATH="${GITHUB_WORKSPACE}/candidate"
          PYTHON_BIN="$(command -v python)"
          BASH_BIN="$(command -v bash)"
          IP_BIN="$(command -v ip)"
          UNSHARE_BIN="$(command -v unshare)"

          sudo env -i \
            PATH="${PATH}" \
            CANDIDATE_PATH="${CANDIDATE_PATH}" \
            PYTHON_BIN="${PYTHON_BIN}" \
            BASH_BIN="${BASH_BIN}" \
            IP_BIN="${IP_BIN}" \
            "${UNSHARE_BIN}" --net -- "${BASH_BIN}" -c '
              set -euo pipefail
              "${IP_BIN}" link set lo up
              if "${IP_BIN}" route show default | grep -q .; then
                echo "::error::Promotion gate network namespace has a default route"
                exit 1
              fi
              if "${IP_BIN}" -o addr show scope global | grep -q .; then
                echo "::error::Promotion gate network namespace has a global address"
                exit 1
              fi
              echo "PASS: promotion gate network namespace has no default route"
              cd "${CANDIDATE_PATH}"
              "${PYTHON_BIN}" -m pytest -q
              echo "STAGE CE SILENT FULL GATE PASSED"
            '

      - name: Tag the release candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
          DEVELOPMENT_RUN_ID: ${{ steps.source.outputs.development_run_id }}
          RC_TAG: ${{ steps.rc.outputs.rc_tag }}
          RC_REUSE: ${{ steps.rc.outputs.rc_reuse }}
        run: |
          set -euo pipefail

          if [[ "${RC_REUSE}" == "true" ]]; then
            echo "Candidate ${RC_TAG} already exists for this commit and digest; nothing to tag"
            exit 0
          fi

          # The tag message is exactly this JSON object; release.yml reads it.
          TAG_MESSAGE="$(
            jq -cn \
              --arg sourceCommit "${SOURCE_COMMIT}" \
              --arg imageDigest "${IMAGE_DIGEST}" \
              --argjson developmentRunId "${DEVELOPMENT_RUN_ID}" \
              --argjson workflowRunId "${GITHUB_RUN_ID}" \
              '{sourceCommit: $sourceCommit, imageDigest: $imageDigest, developmentRunId: $developmentRunId, workflowRunId: $workflowRunId}'
          )"

          if [[ "${DRY_RUN}" == "true" ]]; then
            echo "DRY RUN: would create annotated tag ${RC_TAG} on ${SOURCE_COMMIT} with message ${TAG_MESSAGE}"
            exit 0
          fi

          TAG_OBJECT_SHA="$(
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/git/tags" \
              -f tag="${RC_TAG}" \
              -f message="${TAG_MESSAGE}" \
              -f object="${SOURCE_COMMIT}" \
              -f type="commit" \
              -f 'tagger[name]=github-actions[bot]' \
              -f 'tagger[email]=41898282+github-actions[bot]@users.noreply.github.com' \
              --jq '.sha'
          )"
          [[ "${TAG_OBJECT_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::GitHub did not return a valid annotated tag object SHA"
            exit 1
          }
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RC_TAG}" \
            -f sha="${TAG_OBJECT_SHA}" \
            >/dev/null

          TAG_TARGET="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT_SHA}" --jq '.object.sha')"
          [[ "${TAG_TARGET}" == "${SOURCE_COMMIT}" ]] || {
            echo "::error::${RC_TAG} points at ${TAG_TARGET}, expected ${SOURCE_COMMIT}"
            exit 1
          }
          echo "PASS: annotated tag ${RC_TAG} seals ${SOURCE_COMMIT} and ${IMAGE_DIGEST}"

      - name: Push the immutable candidate image tag
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
          RC_TAG: ${{ steps.rc.outputs.rc_tag }}
        run: |
          set -euo pipefail

          command -v skopeo >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y skopeo
          }
          SOURCE_IMAGE="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          RC_IMAGE="${IMAGE_REPOSITORY}:${RC_TAG#v}"

          CURRENT="$(skopeo inspect --format '{{.Digest}}' "docker://${RC_IMAGE}" 2>/dev/null || true)"
          if [[ "${CURRENT}" == "${IMAGE_DIGEST}" ]]; then
            echo "PASS: ${RC_IMAGE} already is ${IMAGE_DIGEST}"
            exit 0
          fi
          [[ -z "${CURRENT}" ]] || {
            echo "::error::${RC_IMAGE} already points at ${CURRENT}; a candidate tag is never moved"
            exit 1
          }

          if [[ "${DRY_RUN}" == "true" ]]; then
            skopeo inspect --format '{{.Digest}}' "docker://${SOURCE_IMAGE}" >/dev/null
            echo "DRY RUN: would copy ${SOURCE_IMAGE} to ${RC_IMAGE} without rebuilding"
            exit 0
          fi

          skopeo copy --all --preserve-digests "docker://${SOURCE_IMAGE}" "docker://${RC_IMAGE}"
          ACTUAL="$(skopeo inspect --format '{{.Digest}}' "docker://${RC_IMAGE}")"
          [[ "${ACTUAL}" == "${IMAGE_DIGEST}" ]] || {
            echo "::error::${RC_IMAGE} resolved to ${ACTUAL}, expected ${IMAGE_DIGEST}"
            exit 1
          }
          echo "PASS: ${RC_IMAGE} -> ${IMAGE_DIGEST}"

      - name: Promote CE to Stage
        id: deploy
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          PROMOTION_IMAGE: ${{ steps.image.outputs.promotion_image }}
          EXPECTED_VERSION: ${{ steps.source.outputs.expected_version }}
          RC_TAG: ${{ steps.rc.outputs.rc_tag }}
        run: |
          set -euo pipefail

          if [[ "${DRY_RUN}" == "true" ]]; then
            STAGE_IMAGE="$(
              python .github/scripts/dokploy_release.py current-image \
                --application-id "${CE_STAGE_APPLICATION_ID}"
            )"
            python .github/scripts/dokploy_release.py health \
              --health-url "${CE_STAGE_HEALTH_URL}" \
              --expected-version ""
            echo "DRY RUN: Stage runs ${STAGE_IMAGE}; would deploy ${PROMOTION_IMAGE} (candidate ${RC_TAG}) and wait for version ${EXPECTED_VERSION}"
            exit 0
          fi

          echo "Promoting ${PROMOTION_IMAGE} (candidate ${RC_TAG})"
          python .github/scripts/dokploy_release.py deploy \
            --application-id "${CE_STAGE_APPLICATION_ID}" \
            --image "${PROMOTION_IMAGE}" \
            --health-url "${CE_STAGE_HEALTH_URL}" \
            --expected-version "${EXPECTED_VERSION}" \
            --title "Stage ${SOURCE_COMMIT}" \
            --description "nowlert-ce GitHub Actions run ${GITHUB_RUN_ID}" \
            --noop-ok

      # Live-environment verification is read-only. Functional delivery paths
      # were already exercised inside the network-isolated full gate above.
      - name: Run notification-silent CE Stage promotion smoke
        id: silent_smoke
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          PROMOTION_IMAGE: ${{ steps.image.outputs.promotion_image }}
          EXPECTED_VERSION: ${{ steps.source.outputs.expected_version }}
        run: |
          set -euo pipefail

          python .github/scripts/dokploy_release.py promotion-smoke \
            --application-id "${CE_STAGE_APPLICATION_ID}" \
            --image "${PROMOTION_IMAGE}" \
            --health-url "${CE_STAGE_HEALTH_URL}" \
            --expected-version "${EXPECTED_VERSION}" \
            --success-marker "STAGE CE SILENT PROMOTION SMOKE PASSED"

      - name: Advance Stage source branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
        run: |
          set -euo pipefail

          CURRENT_STAGE_SHA="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/stage" --jq '.object.sha'
          )"

          if [[ "${CURRENT_STAGE_SHA}" == "${SOURCE_COMMIT}" ]]; then
            echo "PASS: stage already references ${SOURCE_COMMIT}"
            exit 0
          fi

          COMPARE="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${CURRENT_STAGE_SHA}...${SOURCE_COMMIT}")"
          STATUS="$(jq -r '.status' <<<"${COMPARE}")"
          BEHIND_BY="$(jq -r '.behind_by' <<<"${COMPARE}")"
          [[ "${BEHIND_BY}" == "0" && "${STATUS}" == "ahead" ]] || {
            echo "::error::stage cannot fast-forward from ${CURRENT_STAGE_SHA} to ${SOURCE_COMMIT} (status=${STATUS}, behind_by=${BEHIND_BY})"
            exit 1
          }

          if [[ "${DRY_RUN}" == "true" ]]; then
            echo "DRY RUN: would fast-forward stage from ${CURRENT_STAGE_SHA} to ${SOURCE_COMMIT}"
            exit 0
          fi

          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/stage" \
            -f sha="${SOURCE_COMMIT}" \
            -F force=false \
            >/dev/null

          STAGE_SHA=""
          for attempt in {1..15}; do
            STAGE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/stage" --jq '.object.sha')"
            [[ "${STAGE_SHA}" == "${SOURCE_COMMIT}" ]] && break
            echo "Waiting for stage ref propagation (${attempt}/15): ${STAGE_SHA}"
            sleep 2
          done
          [[ "${STAGE_SHA}" == "${SOURCE_COMMIT}" ]] || {
            echo "::error::stage branch is ${STAGE_SHA}, expected ${SOURCE_COMMIT}"
            exit 1
          }
          echo "Stage branch now references ${STAGE_SHA}"

      - name: Record CE Stage promotion
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          STAGE_BEFORE: ${{ steps.source.outputs.stage_before }}
          PROMOTION_IMAGE: ${{ steps.image.outputs.promotion_image }}
          EXPECTED_VERSION: ${{ steps.source.outputs.expected_version }}
          DEVELOPMENT_RUN_ID: ${{ steps.source.outputs.development_run_id }}
          RC_TAG: ${{ steps.rc.outputs.rc_tag }}
          RC_REUSE: ${{ steps.rc.outputs.rc_reuse }}
        run: |
          {
            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "## CE Stage promotion dry run passed (nothing changed)"
            else
              echo "## CE Stage promotion passed"
            fi
            echo
            echo "- Source commit (what Development runs): \`${SOURCE_COMMIT}\`"
            echo "- Application version: \`${EXPECTED_VERSION}\`"
            echo "- Development CI run: \`${DEVELOPMENT_RUN_ID}\`"
            echo "- CE image: \`${PROMOTION_IMAGE}\`"
            echo "- Release candidate: \`${RC_TAG}\` (reused: ${RC_REUSE})"
            echo "- Stage branch before: \`${STAGE_BEFORE}\`"
            echo "- Full notification-silent gate: passed"
            echo "- Gate network: isolated namespace, no default route or global address"
            echo "- External notification delivery during promotion: disabled"
            echo "- Rebuild performed: no"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Roll back CE after a failed Stage gate
        if: ${{ (steps.deploy.outcome == 'failure' || steps.silent_smoke.outcome == 'failure') && steps.deploy.outputs.previous_image != '' }}
        continue-on-error: true
        shell: bash
        env:
          PREVIOUS_IMAGE: ${{ steps.deploy.outputs.previous_image }}
        run: |
          python .github/scripts/dokploy_release.py deploy \
            --application-id "${CE_STAGE_APPLICATION_ID}" \
            --image "${PREVIOUS_IMAGE}" \
            --health-url "${CE_STAGE_HEALTH_URL}" \
            --title "Automatic CE Stage rollback ${GITHUB_RUN_ID}" \
            --description "The CE Stage promotion or silent smoke gate failed" \
            --allow-mutable \
            --noop-ok
