name: Verify CE Runtime Drift

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nowlert-ce-runtime-drift
  cancel-in-progress: false

jobs:
  verify:
    name: Compare CE runtime with desired-state ledger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-reference

    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}

    steps:
      - name: Checkout drift-verification code
        uses: actions/checkout@v7

      - name: Verify read-only workflow context
        shell: bash
        run: |
          set -euo pipefail

          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || {
            echo "::error::Runtime drift verification is restricted to main"
            exit 1
          }

          [[ -n "${DOKPLOY_URL}" ]] || {
            echo "::error::DOKPLOY_URL is missing"
            exit 1
          }

          [[ -n "${DOKPLOY_API_KEY}" ]] || {
            echo "::error::DOKPLOY_API_KEY is missing"
            exit 1
          }

      - name: Configure read-only AWS credentials for CE drift verification
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::845958214943:role/GitHubActions-NowlertCE-LedgerReader
          aws-region: eu-west-1
          role-session-name: nowlert-ce-drift-${{ github.run_id }}
          role-duration-seconds: 900
          allowed-account-ids: "845958214943"
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Verify CE Stage and Production Reference runtime drift
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/verify_drift.py \
            --report ce-runtime-drift-report.json

      - name: Upload CE drift evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nowlert-ce-runtime-drift-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: ce-runtime-drift-report.json
