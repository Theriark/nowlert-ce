name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Run automated tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tools .github/scripts

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate WebUI JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check src/webui/app.js
          node --check src/webui/filtering.js

      - name: Validate public YAML files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          import yaml


          for name in (
              "config/config.example.yaml",
              "docker-compose.yml",
              "compose.production.yaml",
              ".github/workflows/ci.yml",
              ".github/workflows/promote-stage.yml",
              ".github/workflows/finalize-release.yml",
          ):
              value = yaml.safe_load(Path(name).read_text(encoding="utf-8"))
              if not isinstance(value, dict):
                  raise SystemExit(f"{name} must contain a YAML object")
              print(f"validated {name}")
          PY

      - name: Validate production Compose
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f compose.production.yaml config >/dev/null

      - name: Build production image
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag nowlert:ci .

  deploy-development:
    name: Build and deploy CE Development
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: development

    env:
      IMAGE: ghcr.io/theriark/nowlert-ce
      SOURCE_SHA: ${{ github.sha }}
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      DOKPLOY_CE_DEVELOPMENT_APPLICATION_ID: ivj7Ixgw2cP29g6riR2AH

    steps:
      - name: Verify Development source branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/development" ]] || {
            echo "::error::Development deployment must run from the development branch; received ${GITHUB_REF}"
            exit 1
          }
          echo "Development source verified: ${SOURCE_SHA}"

      - name: Checkout tested source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify protected deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${DOKPLOY_URL}" ]] || { echo "::error::DOKPLOY_URL is missing"; exit 1; }
          [[ -n "${DOKPLOY_API_KEY}" ]] || { echo "::error::DOKPLOY_API_KEY is missing"; exit 1; }
          [[ -n "${CF_ACCESS_CLIENT_ID}" ]] || { echo "::error::CF_ACCESS_CLIENT_ID is missing"; exit 1; }
          [[ -n "${CF_ACCESS_CLIENT_SECRET}" ]] || { echo "::error::CF_ACCESS_CLIENT_SECRET is missing"; exit 1; }

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish Development image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            NOWLERT_TEAMS_ICON_BASE_URL=https://raw.githubusercontent.com/${{ github.repository }}/${{ env.SOURCE_SHA }}/assets/icons
          tags: |
            ${{ env.IMAGE }}:development
            ${{ env.IMAGE }}:sha-${{ env.SOURCE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Development SHA tag matches build digest
        shell: bash
        run: |
          set -euo pipefail
          SHA_TAG="${IMAGE}:sha-${SOURCE_SHA}"
          BUILD_DIGEST="${{ steps.build.outputs.digest }}"
          TAG_DIGEST="sha256:$(
            docker buildx imagetools inspect "${SHA_TAG}" --raw |
              sha256sum |
              awk '{print $1}'
          )"

          [[ "${TAG_DIGEST}" == "${BUILD_DIGEST}" ]] || {
            echo "::error::Development SHA tag ${SHA_TAG} resolves to ${TAG_DIGEST}, expected ${BUILD_DIGEST}"
            exit 1
          }
          echo "Verified ${SHA_TAG} resolves to exact build digest ${BUILD_DIGEST}"

      - name: Verify Development image version and approved owl
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_VERSION="$(
            PYTHONPATH=src python3 -c 'from version import VERSION; print(VERSION)'
          )"
          EXPECTED_ICON_SHA="684bda33be520811ab80057da41c34112ffc58ee7a559ffd66ba3f02b92f052a"
          IMAGE_REF="${IMAGE}@${{ steps.build.outputs.digest }}"

          echo "Development immutable image: ${IMAGE_REF}"
          docker pull "${IMAGE_REF}"
          docker run --rm \
            --entrypoint python \
            -e PYTHONPATH=/nowlert/src \
            "${IMAGE_REF}" \
            -c 'import hashlib, pathlib, sys; from version import VERSION; expected_version, expected_sha = sys.argv[1:3]; data = pathlib.Path("/nowlert/assets/icons/nowlert.png").read_bytes(); assert VERSION == expected_version, (VERSION, expected_version); assert hashlib.sha256(data).hexdigest() == expected_sha' \
            "${EXPECTED_VERSION}" \
            "${EXPECTED_ICON_SHA}"

          echo "Verified image version ${EXPECTED_VERSION} and approved owl ${EXPECTED_ICON_SHA}"

      - name: Deploy exact CE SHA tag to Development
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(
            PYTHONPATH=src python3 -c 'from version import VERSION; print(VERSION)'
          )"
          python .github/scripts/dokploy_swarm_deploy.py \
            --application-id "${DOKPLOY_CE_DEVELOPMENT_APPLICATION_ID}" \
            --image "${IMAGE}:sha-${SOURCE_SHA}" \
            --health-url https://ce-dev-nowlert.theriark.dev/api/health \
            --expected-version "${EXPECTED_VERSION}" \
            --title "CE Development ${SOURCE_SHA}" \
            --description "GitHub Actions run ${{ github.run_id }}"

      - name: Verify deployed WebUI acceptance bundle
        shell: bash
        run: |
          set -euo pipefail
          UI_BUILD="$(PYTHONPATH=src python -c 'from webui.service import UI_BUILD; print(UI_BUILD)')"
          BASE_URL="https://ce-dev-nowlert.theriark.dev"
          ACCESS_HEADERS=(
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}"
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}"
            -H "Cache-Control: no-cache"
            -H "User-Agent: Theriark-GitHub-Actions/1.0"
          )

          require_contains() {
            local label="$1"
            local needle="$2"
            local haystack="$3"
            if ! grep -Fq "$needle" <<< "$haystack"; then
              echo "WAIT: $label is not serving expected WebUI build $UI_BUILD"
              return 1
            fi
          }

          verify_live_bundle() {
            local html css app ownership routing routing_css filtering filter_sync filter_sync_css filter_css qa_patch dashboard acceptance cleanup reference

            html="$(
              curl --fail --silent --show-error \
                "${ACCESS_HEADERS[@]}" \
                "${BASE_URL}/?ui_acceptance=${SOURCE_SHA}"
            )" || { echo "WAIT: WebUI HTML request failed"; return 1; }
            require_contains "HTML build marker" "name=\"nowlert-ui-build\" content=\"${UI_BUILD}\"" "${html}" || return 1
            require_contains "HTML qa_patch" "/ui/qa_patch.css?v=${UI_BUILD}" "${html}" || return 1
            require_contains "HTML app" "/ui/app.js?v=${UI_BUILD}" "${html}" || return 1
            require_contains "HTML Routing Flow" "/ui/routing_flow.js?v=${UI_BUILD}" "${html}" || return 1
            require_contains "HTML Routing Flow CSS" "/ui/routing_flow.css?v=${UI_BUILD}" "${html}" || return 1
            require_contains "HTML Filtering" "/ui/filtering.js?v=${UI_BUILD}" "${html}" || return 1
            require_contains "HTML Filtering CSS" "/ui/filtering_ownership_sync.css?v=${UI_BUILD}" "${html}" || return 1
            require_contains "HTML qa_patch JS" "/ui/qa_patch.js?v=${UI_BUILD}" "${html}" || return 1
            require_contains "HTML Dashboard" "/ui/operations_dashboard.js?v=${UI_BUILD}" "${html}" || return 1
            require_contains "HTML acceptance" "/ui/operations_acceptance.js?v=${UI_BUILD}" "${html}" || return 1
            require_contains "HTML cleanup" "/ui/acceptance_cleanup.js?v=${UI_BUILD}" "${html}" || return 1
            require_contains "HTML consistency layer" "/ui/management_consistency.js?v=${UI_BUILD}" "${html}" || return 1
            require_contains "HTML retirement layer" "/ui/source_ui_retirement.js?v=${UI_BUILD}" "${html}" || return 1

            css="$(
              curl --fail --silent --show-error \
                "${ACCESS_HEADERS[@]}" \
                "${BASE_URL}/ui/qa_patch.css?v=${UI_BUILD}"
            )" || { echo "WAIT: qa_patch.css request failed"; return 1; }
            require_contains "qa_patch.css marker" "round-18 acceptance corrections" "${css}" || return 1
            require_contains "qa_patch.css navigation" "#primary-nav .nav-item[hidden]" "${css}" || return 1
            require_contains "qa_patch.css owl" "transform: scale(1.65)" "${css}" || return 1
            require_contains "qa_patch.css workspace" "#app-shell .workspace" "${css}" || return 1
            require_contains "qa_patch.css backups" "backup-dashboard-grid-top" "${css}" || return 1

            app="$(
              curl --fail --silent --show-error \
                "${ACCESS_HEADERS[@]}" \
                "${BASE_URL}/ui/app.js?v=${UI_BUILD}"
            )" || { echo "WAIT: app.js request failed"; return 1; }
            require_contains "app.js preview" "Preview completed." "${app}" || return 1

            ownership="$(
              curl --fail --silent --show-error \
                "${ACCESS_HEADERS[@]}" \
                "${BASE_URL}/ui/source_ui_retirement.js?v=${UI_BUILD}"
            )" || { echo "WAIT: source_ui_retirement.js request failed"; return 1; }
            require_contains "retirement audit" "auditNav.hidden = !admin;" "${ownership}" || return 1
            require_contains "retirement backups" "backupsNav.hidden = !admin;" "${ownership}" || return 1
            require_contains "retirement users" "usersNav.hidden = !admin;" "${ownership}" || return 1

            routing="$(
              curl --fail --silent --show-error \
                "${ACCESS_HEADERS[@]}" \
                "${BASE_URL}/ui/routing_flow.js?v=${UI_BUILD}"
            )" || { echo "WAIT: routing_flow.js request failed"; return 1; }
            require_contains "Routing Flow adaptive layout" "function sortLayerByDesired(items, desired)" "${routing}" || return 1
            require_contains "Routing Flow captured range" 'const routingRangeSelect = section.querySelector("#rf-range");' "${routing}" || return 1
            require_contains "Routing Flow bounded layout" "const maxSlack = Math.max(24, Math.min(48, gap * 3));" "${routing}" || return 1
            require_contains "Routing Flow filter names" 'String(filter?.filter_name || filter?.name || "").trim()' "${routing}" || return 1
            require_contains "Routing Flow filter values" "function filterCardValues(filter)" "${routing}" || return 1
            require_contains "Routing Flow value overflow" "rf-filter-value-overflow-wrap" "${routing}" || return 1
            require_contains "Routing Flow six visible values" "const visibleValueLimit = 6;" "${routing}" || return 1
            require_contains "Routing Flow value popover labels" "rf-filter-value-popover-label" "${routing}" || return 1
            require_contains "Routing Flow interactive node shell" 'const node = el("div", `rf-node rf-${kind}`);' "${routing}" || return 1
            require_contains "Routing Flow value menu ownership" 'valueToggle.setAttribute("aria-controls", valuePopover.id);' "${routing}" || return 1
            require_contains "Routing Flow value top-layer popover" 'valuePopover.setAttribute("popover", "auto");' "${routing}" || return 1
            require_contains "Routing Flow value popover activation" "valuePopover.showPopover();" "${routing}" || return 1
            require_contains "Routing Flow selected range" "const requestRange = selectedRoutingRange();" "${routing}" || return 1
            require_contains "Routing Flow response range" "String(next.range || \"\") !== requestRange" "${routing}" || return 1

            routing_css="$(
              curl --fail --silent --show-error \
                "${ACCESS_HEADERS[@]}" \
                "${BASE_URL}/ui/routing_flow.css?v=${UI_BUILD}"
            )" || { echo "WAIT: routing_flow.css request failed"; return 1; }
            require_contains "Routing Flow filter summary" ".rf-filter-card-summary" "${routing_css}" || return 1
            require_contains "Routing Flow value popover" ".rf-filter-value-popover" "${routing_css}" || return 1
            require_contains "Routing Flow open popover stacking" 'rf-filter-card:has(.rf-filter-value-overflow[aria-expanded="true"])' "${routing_css}" || return 1
            require_contains "Routing Flow top-layer value menu CSS" ".rf-filter-value-popover[popover]" "${routing_css}" || return 1

            filtering="$(
              curl --fail --silent --show-error \
                "${ACCESS_HEADERS[@]}" \
                "${BASE_URL}/ui/filtering.js?v=${UI_BUILD}"
            )" || { echo "WAIT: filtering.js request failed"; return 1; }
            require_contains "Filtering six-column header" 'data-filter-sync-column="sharing">Sharing</th><th>Actions</th>' "${filtering}" || return 1
            require_contains "Filtering full-width details" 'className: "filtering-expanded-row"' "${filtering}" || return 1
            require_contains "Filtering title reset" "delete title.dataset.i18nSource;" "${filtering}" || return 1
            require_contains "Filtering synchronous final-paint event" "nowlert:filtering-rendered" "${filtering}" || return 1

            filter_sync="$(
              curl --fail --silent --show-error \
                "${ACCESS_HEADERS[@]}" \
                "${BASE_URL}/ui/filtering_ownership_sync.js?v=${UI_BUILD}"
            )" || { echo "WAIT: filtering_ownership_sync.js request failed"; return 1; }
            require_contains "Filtering Name enforcement" 'nameHeading.textContent !== "Name"' "${filter_sync}" || return 1
            require_contains "Filtering synchronous ownership decorator" "decorate(event.detail);" "${filter_sync}" || return 1

            filter_sync_css="$(
              curl --fail --silent --show-error \
                "${ACCESS_HEADERS[@]}" \
                "${BASE_URL}/ui/filtering_ownership_sync.css?v=${UI_BUILD}"
            )" || { echo "WAIT: filtering_ownership_sync.css request failed"; return 1; }
            require_contains "Filtering scoped actions alignment" ".filtering-table .filtering-actions-cell > div" "${filter_sync_css}" || return 1

            filter_css="$(
              curl --fail --silent --show-error \
                "${ACCESS_HEADERS[@]}" \
                "${BASE_URL}/ui/filtering.css?v=${UI_BUILD}"
            )" || { echo "WAIT: filtering.css request failed"; return 1; }
            require_contains "Filtering Actions width" ".filtering-table th:nth-child(6) { width: 24%; }" "${filter_css}" || return 1
            require_contains "Filtering left-aligned grid" "grid-template-columns: repeat(auto-fit, minmax(220px, 280px));" "${filter_css}" || return 1
            require_contains "Filtering left alignment" "justify-content: start;" "${filter_css}" || return 1

            qa_patch="$(
              curl --fail --silent --show-error \
                "${ACCESS_HEADERS[@]}" \
                "${BASE_URL}/ui/qa_patch.js?v=${UI_BUILD}"
            )" || { echo "WAIT: qa_patch.js request failed"; return 1; }
            require_contains "Workspace cache fields" "const QA_WORKSPACE_CACHE_FIELDS" "${qa_patch}" || return 1

            dashboard="$(
              curl --fail --silent --show-error \
                "${ACCESS_HEADERS[@]}" \
                "${BASE_URL}/ui/operations_dashboard.js?v=${UI_BUILD}"
            )" || { echo "WAIT: operations_dashboard.js request failed"; return 1; }
            require_contains "Dashboard request range capture" "const requestedRange = state.historyRange;" "${dashboard}" || return 1
            require_contains "Dashboard queued refresh" "refreshPending = true;" "${dashboard}" || return 1
            require_contains "Dashboard first-paint snapshot" "function restoreDashboardSnapshot(session, range)" "${dashboard}" || return 1
            require_contains "Dashboard range-scoped snapshot" "snapshot.range !== range" "${dashboard}" || return 1
            require_contains "Dashboard dedicated delivery feed" "let dashboardDeliveries = [];" "${dashboard}" || return 1
            require_contains "Dashboard tagged live refresh" "dashboardFeed: true" "${dashboard}" || return 1

            acceptance="$(
              curl --fail --silent --show-error \
                "${ACCESS_HEADERS[@]}" \
                "${BASE_URL}/ui/operations_acceptance.js?v=${UI_BUILD}"
            )" || { echo "WAIT: operations_acceptance.js request failed"; return 1; }
            require_contains "Dashboard persisted range bootstrap" "readStoredRangeForSession(session, \"dashboard-range\")" "${acceptance}" || return 1
            require_contains "Dashboard live status only tracks tagged refreshes" "if (!options.dashboardFeed)" "${acceptance}" || return 1

            cleanup="$(
              curl --fail --silent --show-error \
                "${ACCESS_HEADERS[@]}" \
                "${BASE_URL}/ui/acceptance_cleanup.js?v=${UI_BUILD}"
            )" || { echo "WAIT: acceptance_cleanup.js request failed"; return 1; }
            require_contains "Filtering cleanup main rows" '#filter-table > tr.filtering-policy-row' "${cleanup}" || return 1
            require_contains "Filtering synchronous acceptance decorator" "applyFilteringAcceptance(event.detail);" "${cleanup}" || return 1

            reference="$(
              curl --fail --silent --show-error \
                "${ACCESS_HEADERS[@]}" \
                "${BASE_URL}/ui/reference_acceptance.js?v=${UI_BUILD}"
            )" || { echo "WAIT: reference_acceptance.js request failed"; return 1; }
            require_contains "Security authoritative live role" 'const admin = typeof isAdmin === "function" && isAdmin();' "${reference}" || return 1
            require_contains "Security authenticated role guard" "if (!state.user) return;" "${reference}" || return 1
            require_contains "Security clears stale role translation" "delete roleValue.dataset.i18nSource;" "${reference}" || return 1

            return 0
          }

          for attempt in $(seq 1 12); do
            if verify_live_bundle; then
              echo "PASS: live CE Development is serving WebUI acceptance bundle ${UI_BUILD}"
              break
            fi
            if [ "${attempt}" -eq 12 ]; then
              echo "ERROR: live CE Development did not converge to WebUI acceptance bundle ${UI_BUILD}"
              exit 1
            fi
            echo "WAIT: deployment is still converging (${attempt}/12); retrying in 5 seconds"
            sleep 5
          done

      - name: Record immutable Development result
        shell: bash
        run: |
          {
            echo "## Nowlert CE Development passed"
            echo
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- Development tag: \`${IMAGE}:development\`"
            echo "- Dokploy deployment ref: \`${IMAGE}:sha-${SOURCE_SHA}\`"
            echo "- Immutable image: \`${IMAGE}@${{ steps.build.outputs.digest }}\`"
            echo "- Dokploy deployment ID: \`${{ steps.deploy.outputs.deployment_id }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
