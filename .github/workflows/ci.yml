name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Run automated tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tools .github/scripts

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate WebUI JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check src/webui/app.js
          node --check src/webui/filtering.js

      - name: Validate public YAML files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          import yaml


          for name in (
              "config/config.example.yaml",
              "docker-compose.yml",
              "compose.production.yaml",
              ".github/workflows/ci.yml",
              ".github/workflows/promote-stage.yml",
              ".github/workflows/finalize-release.yml",
          ):
              value = yaml.safe_load(Path(name).read_text(encoding="utf-8"))
              if not isinstance(value, dict):
                  raise SystemExit(f"{name} must contain a YAML object")
              print(f"validated {name}")
          PY

      - name: Validate production Compose
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f compose.production.yaml config >/dev/null

      - name: Build production image
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag nowlert:ci .

  deploy-development:
    name: Build and deploy CE Development
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: development

    env:
      IMAGE: ghcr.io/theriark/nowlert-ce
      SOURCE_SHA: ${{ github.sha }}
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      DOKPLOY_CE_DEVELOPMENT_APPLICATION_ID: ivj7Ixgw2cP29g6riR2AH

    steps:
      - name: Verify Development source branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/development" ]] || {
            echo "::error::Development deployment must run from the development branch; received ${GITHUB_REF}"
            exit 1
          }
          echo "Development source verified: ${SOURCE_SHA}"

      - name: Checkout tested source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify protected deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${DOKPLOY_URL}" ]] || { echo "::error::DOKPLOY_URL is missing"; exit 1; }
          [[ -n "${DOKPLOY_API_KEY}" ]] || { echo "::error::DOKPLOY_API_KEY is missing"; exit 1; }
          [[ -n "${CF_ACCESS_CLIENT_ID}" ]] || { echo "::error::CF_ACCESS_CLIENT_ID is missing"; exit 1; }
          [[ -n "${CF_ACCESS_CLIENT_SECRET}" ]] || { echo "::error::CF_ACCESS_CLIENT_SECRET is missing"; exit 1; }

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish Development image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            NOWLERT_TEAMS_ICON_BASE_URL=https://raw.githubusercontent.com/${{ github.repository }}/${{ env.SOURCE_SHA }}/assets/icons
          tags: |
            ${{ env.IMAGE }}:development
            ${{ env.IMAGE }}:sha-${{ env.SOURCE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Development SHA tag matches build digest
        shell: bash
        run: |
          set -euo pipefail
          SHA_TAG="${IMAGE}:sha-${SOURCE_SHA}"
          BUILD_DIGEST="${{ steps.build.outputs.digest }}"
          TAG_DIGEST="sha256:$(
            docker buildx imagetools inspect "${SHA_TAG}" --raw |
              sha256sum |
              awk '{print $1}'
          )"

          [[ "${TAG_DIGEST}" == "${BUILD_DIGEST}" ]] || {
            echo "::error::Development SHA tag ${SHA_TAG} resolves to ${TAG_DIGEST}, expected ${BUILD_DIGEST}"
            exit 1
          }
          echo "Verified ${SHA_TAG} resolves to exact build digest ${BUILD_DIGEST}"

      - name: Verify Development image version and approved owl
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_VERSION="$(
            PYTHONPATH=src python3 -c 'from version import VERSION; print(VERSION)'
          )"
          EXPECTED_ICON_SHA="684bda33be520811ab80057da41c34112ffc58ee7a559ffd66ba3f02b92f052a"
          IMAGE_REF="${IMAGE}@${{ steps.build.outputs.digest }}"

          echo "Development immutable image: ${IMAGE_REF}"
          docker pull "${IMAGE_REF}"
          docker run --rm \
            --entrypoint python \
            -e PYTHONPATH=/nowlert/src \
            "${IMAGE_REF}" \
            -c 'import hashlib, pathlib, sys; from version import VERSION; expected_version, expected_sha = sys.argv[1:3]; data = pathlib.Path("/nowlert/assets/icons/nowlert.png").read_bytes(); assert VERSION == expected_version, (VERSION, expected_version); assert hashlib.sha256(data).hexdigest() == expected_sha' \
            "${EXPECTED_VERSION}" \
            "${EXPECTED_ICON_SHA}"

          echo "Verified image version ${EXPECTED_VERSION} and approved owl ${EXPECTED_ICON_SHA}"

      - name: Deploy exact CE SHA tag to Development
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(
            PYTHONPATH=src python3 -c 'from version import VERSION; print(VERSION)'
          )"
          python .github/scripts/dokploy_swarm_deploy.py \
            --application-id "${DOKPLOY_CE_DEVELOPMENT_APPLICATION_ID}" \
            --image "${IMAGE}:sha-${SOURCE_SHA}" \
            --health-url https://ce-dev-nowlert.theriark.dev/api/health \
            --expected-version "${EXPECTED_VERSION}" \
            --title "CE Development ${SOURCE_SHA}" \
            --description "GitHub Actions run ${{ github.run_id }}"

      - name: Verify deployed WebUI acceptance bundle
        shell: bash
        run: |
          set -euo pipefail
          UI_BUILD="$(PYTHONPATH=src python -c 'from webui.service import UI_BUILD; print(UI_BUILD)')"
          BASE_URL="https://ce-dev-nowlert.theriark.dev"
          ACCESS_HEADERS=(
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}"
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}"
            -H "Cache-Control: no-cache"
            -H "User-Agent: Theriark-GitHub-Actions/1.0"
          )

          HTML="$(
            curl --fail --silent --show-error \
              "${ACCESS_HEADERS[@]}" \
              "${BASE_URL}/?ui_acceptance=${SOURCE_SHA}"
          )"
          grep -Fq "name=\"nowlert-ui-build\" content=\"${UI_BUILD}\"" <<< "${HTML}"
          grep -Fq "/ui/qa_patch.css?v=${UI_BUILD}" <<< "${HTML}"
          grep -Fq "/ui/app.js?v=${UI_BUILD}" <<< "${HTML}"
          grep -Fq "/ui/routing_flow.js?v=${UI_BUILD}" <<< "${HTML}"
          grep -Fq "/ui/filtering.js?v=${UI_BUILD}" <<< "${HTML}"
          grep -Fq "/ui/filtering_ownership_sync.css?v=${UI_BUILD}" <<< "${HTML}"
          grep -Fq "/ui/management_consistency.js?v=${UI_BUILD}" <<< "${HTML}"
          grep -Fq "/ui/source_ui_retirement.js?v=${UI_BUILD}" <<< "${HTML}"

          CSS="$(
            curl --fail --silent --show-error \
              "${ACCESS_HEADERS[@]}" \
              "${BASE_URL}/ui/qa_patch.css?v=${UI_BUILD}"
          )"
          grep -Fq "round-18 acceptance corrections" <<< "${CSS}"
          grep -Fq "#primary-nav .nav-item[hidden]" <<< "${CSS}"
          grep -Fq "transform: scale(1.65)" <<< "${CSS}"
          grep -Fq "#app-shell .workspace" <<< "${CSS}"
          grep -Fq "backup-dashboard-grid-top" <<< "${CSS}"

          APP="$(
            curl --fail --silent --show-error \
              "${ACCESS_HEADERS[@]}" \
              "${BASE_URL}/ui/app.js?v=${UI_BUILD}"
          )"
          grep -Fq "Preview completed." <<< "${APP}"

          OWNERSHIP="$(
            curl --fail --silent --show-error \
              "${ACCESS_HEADERS[@]}" \
              "${BASE_URL}/ui/source_ui_retirement.js?v=${UI_BUILD}"
          )"
          grep -Fq "auditNav.hidden = !admin;" <<< "${OWNERSHIP}"
          grep -Fq "backupsNav.hidden = !admin;" <<< "${OWNERSHIP}"
          grep -Fq "usersNav.hidden = !admin;" <<< "${OWNERSHIP}"

          ROUTING="$(
            curl --fail --silent --show-error \
              "${ACCESS_HEADERS[@]}" \
              "${BASE_URL}/ui/routing_flow.js?v=${UI_BUILD}"
          )"
          grep -Fq "function sortLayerByDesired(items, desired)" <<< "${ROUTING}"
          grep -Fq "const requestRange = selectedRoutingRange();" <<< "${ROUTING}"
          grep -Fq "String(next.range || \"\") !== requestRange" <<< "${ROUTING}"

          FILTERING="$(
            curl --fail --silent --show-error \
              "${ACCESS_HEADERS[@]}" \
              "${BASE_URL}/ui/filtering.js?v=${UI_BUILD}"
          )"
          grep -Fq 'data-filter-sync-column="sharing">Sharing</th><th>Actions</th>' <<< "${FILTERING}"

          FILTER_SYNC="$(
            curl --fail --silent --show-error \
              "${ACCESS_HEADERS[@]}" \
              "${BASE_URL}/ui/filtering_ownership_sync.js?v=${UI_BUILD}"
          )"
          grep -Fq 'nameHeading.textContent !== "Name"' <<< "${FILTER_SYNC}"

          FILTER_CSS="$(
            curl --fail --silent --show-error \
              "${ACCESS_HEADERS[@]}" \
              "${BASE_URL}/ui/filtering.css?v=${UI_BUILD}"
          )"
          grep -Fq ".filtering-table th:nth-child(6) { width: 24%; }" <<< "${FILTER_CSS}"

          echo "PASS: live CE Development is serving WebUI acceptance bundle ${UI_BUILD}"

      - name: Record immutable Development result
        shell: bash
        run: |
          {
            echo "## Nowlert CE Development passed"
            echo
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- Development tag: \`${IMAGE}:development\`"
            echo "- Dokploy deployment ref: \`${IMAGE}:sha-${SOURCE_SHA}\`"
            echo "- Immutable image: \`${IMAGE}@${{ steps.build.outputs.digest }}\`"
            echo "- Dokploy deployment ID: \`${{ steps.deploy.outputs.deployment_id }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
