name: Development Image

on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: development-image-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Decide whether Development deployment is required
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decision.outputs.deploy }}
      source_sha: ${{ steps.decision.outputs.source_sha }}

    steps:
      - name: Checkout tested source for change detection
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Decide whether to deploy Development
        id: decision
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          echo "source_sha=${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
            echo "Manual run: Development deployment required"
            exit 0
          fi

          if git rev-parse "${SOURCE_SHA}^1" >/dev/null 2>&1; then
            changed_files="$(
              git diff --name-only "${SOURCE_SHA}^1" "${SOURCE_SHA}"
            )"
          else
            changed_files="$(
              git diff-tree \
                --root \
                --no-commit-id \
                --name-only \
                -r "${SOURCE_SHA}"
            )"
          fi

          echo "Changed files:"
          printf '%s\n' "${changed_files}"

          if [[ -z "${changed_files}" ]]; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
            echo "No changed files detected; deploying conservatively"
          elif printf '%s\n' "${changed_files}" |
            grep -qvE '^(\.github/|tests/)'; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
            echo "Application-impacting changes detected"
          else
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
            echo "Pipeline- or test-only change: Development deployment skipped"
            {
              echo "## Development deployment skipped"
              echo
              echo "All changed files are under \`.github/\` or \`tests/\`."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

  publish:
    needs: detect-changes
    if: needs.detect-changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: development

    env:
      IMAGE: ghcr.io/theriark/nowlert-ce
      SOURCE_SHA: ${{ needs.detect-changes.outputs.source_sha }}
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DOKPLOY_CE_DEVELOPMENT_APPLICATION_ID: LZHV0rpjSvusK9k9MGGpp
      DEV_SMOKE_SCHEDULE_ID: ${{ vars.DEV_CE_SMOKE_SCHEDULE_ID }}

    steps:
      - name: Checkout tested source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify protected deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${DOKPLOY_URL}" ]] || { echo "::error::DOKPLOY_URL is missing"; exit 1; }
          [[ -n "${DOKPLOY_API_KEY}" ]] || { echo "::error::DOKPLOY_API_KEY is missing"; exit 1; }
          [[ -n "${DEV_SMOKE_SCHEDULE_ID}" ]] || {
            echo "::error::Repository variable DEV_CE_SMOKE_SCHEDULE_ID is missing"
            exit 1
          }

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish Development image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            NOWLERT_TEAMS_ICON_BASE_URL=https://raw.githubusercontent.com/${{ github.repository }}/${{ env.SOURCE_SHA }}/assets/icons
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ env.SOURCE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Verify Development image version and approved owl
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_VERSION="$(
            PYTHONPATH=src python3 -c 'from version import VERSION; print(VERSION)'
          )"
          EXPECTED_ICON_SHA="684bda33be520811ab80057da41c34112ffc58ee7a559ffd66ba3f02b92f052a"
          IMAGE_REF="${IMAGE}@${{ steps.build.outputs.digest }}"

          docker pull "${IMAGE_REF}"
          docker run --rm \
            --entrypoint python \
            -e PYTHONPATH=/nowlert/src \
            "${IMAGE_REF}" \
            -c 'import hashlib, pathlib, sys; from version import VERSION; expected_version, expected_sha = sys.argv[1:3]; data = pathlib.Path("/nowlert/assets/icons/nowlert.png").read_bytes(); assert VERSION == expected_version, (VERSION, expected_version); assert hashlib.sha256(data).hexdigest() == expected_sha' \
            "${EXPECTED_VERSION}" \
            "${EXPECTED_ICON_SHA}"

          echo "Verified image version ${EXPECTED_VERSION} and approved owl ${EXPECTED_ICON_SHA}"

      - name: Deploy exact CE digest to Development
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(
            PYTHONPATH=src python3 -c 'from version import VERSION; print(VERSION)'
          )"
          python .github/scripts/dokploy_release.py deploy \
            --application-id "${DOKPLOY_CE_DEVELOPMENT_APPLICATION_ID}" \
            --image "${IMAGE}@${{ steps.build.outputs.digest }}" \
            --health-url https://ce-dev.nowlert.theriark.com/api/health \
            --expected-version "${EXPECTED_VERSION}" \
            --title "CE Development ${SOURCE_SHA}" \
            --description "GitHub Actions run ${{ github.run_id }}"

      - name: Run CE Development smoke on VM-09
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/dokploy_release.py run-schedule \
            --schedule-id "${DEV_SMOKE_SCHEDULE_ID}" \
            --success-marker "DEVELOPMENT CE SMOKE PASSED" \
            --timeout 1800

      - name: Record immutable Development result
        shell: bash
        run: |
          {
            echo "## Nowlert CE Development passed"
            echo
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- Development tag: \`${IMAGE}:main\`"
            echo "- Promotion tag: \`${IMAGE}:sha-${SOURCE_SHA}\`"
            echo "- Immutable image: \`${IMAGE}@${{ steps.build.outputs.digest }}\`"
            echo "- Development smoke deployment: \`${{ steps.smoke.outputs.deployment_id }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
