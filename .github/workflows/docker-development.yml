name: Development Image

on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: development-image-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: development

    env:
      IMAGE: ghcr.io/theriark/nowlert-ce
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DOKPLOY_CE_DEVELOPMENT_APPLICATION_ID: nowlert-ce-development-acs6dz
      DEV_SMOKE_SCHEDULE_ID: ${{ vars.DEV_CE_SMOKE_SCHEDULE_ID }}

    steps:
      - name: Checkout tested source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify protected deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${DOKPLOY_URL}" ]] || { echo "::error::DOKPLOY_URL is missing"; exit 1; }
          [[ -n "${DOKPLOY_API_KEY}" ]] || { echo "::error::DOKPLOY_API_KEY is missing"; exit 1; }
          [[ -n "${DEV_SMOKE_SCHEDULE_ID}" ]] || {
            echo "::error::Repository variable DEV_CE_SMOKE_SCHEDULE_ID is missing"
            exit 1
          }

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish Development image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            NOWLERT_TEAMS_ICON_BASE_URL=https://raw.githubusercontent.com/${{ github.repository }}/${{ env.SOURCE_SHA }}/assets/icons
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ env.SOURCE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy exact CE digest to Development
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/dokploy_release.py deploy \
            --application-id "${DOKPLOY_CE_DEVELOPMENT_APPLICATION_ID}" \
            --image "${IMAGE}@${{ steps.build.outputs.digest }}" \
            --health-url https://ce-dev.nowlert.theriark.com/api/health \
            --title "CE Development ${SOURCE_SHA}" \
            --description "GitHub Actions run ${{ github.run_id }}"

      - name: Run official CE Development smoke on VM-12
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/dokploy_release.py run-schedule \
            --schedule-id "${DEV_SMOKE_SCHEDULE_ID}" \
            --success-marker "DEVELOPMENT CE SMOKE PASSED" \
            --timeout 1800

      - name: Record immutable Development result
        shell: bash
        run: |
          {
            echo "## Nowlert CE Development passed"
            echo
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- Development tag: \`${IMAGE}:main\`"
            echo "- Promotion tag: \`${IMAGE}:sha-${SOURCE_SHA}\`"
            echo "- Immutable image: \`${IMAGE}@${{ steps.build.outputs.digest }}\`"
            echo "- Development smoke deployment: \`${{ steps.smoke.outputs.deployment_id }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
