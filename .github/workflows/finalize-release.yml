name: Finalize CE Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v3.0.0"
        required: true
        type: string
      final_image:
        description: "Final immutable CE image digest"
        required: true
        type: string
      source_commit:
        description: "Original full source commit SHA"
        required: true
        type: string
      development_run_id:
        description: "Successful Development Image run ID"
        required: true
        type: string
      stage_promotion_run_id:
        description: "Successful CE Stage promotion run ID"
        required: true
        type: string
      production_reference_run_id:
        description: "Successful CE Production Reference promotion run ID"
        required: true
        type: string
      qa_schedule_deployment_id:
        description: "VM-13 Production Reference smoke schedule deployment ID"
        required: true
        type: string
      release_notes:
        description: "Human-readable release notes"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: nowlert-ce-release-finalization
  cancel-in-progress: false

jobs:
  finalize:
    name: Validate and publish CE release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-reference

    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      VERSION: ${{ inputs.version }}
      FINAL_IMAGE: ${{ inputs.final_image }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      DEVELOPMENT_RUN_ID: ${{ inputs.development_run_id }}
      STAGE_PROMOTION_RUN_ID: ${{ inputs.stage_promotion_run_id }}
      PRODUCTION_REFERENCE_RUN_ID: ${{ inputs.production_reference_run_id }}
      QA_SCHEDULE_DEPLOYMENT_ID: ${{ inputs.qa_schedule_deployment_id }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      CE_PRODREF_APPLICATION_ID: -Qb71PLUZmBHLJ_Iv68Oo

    steps:
      - name: Checkout release workflow code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release inputs and repository state
        shell: bash
        run: |
          set -euo pipefail

          [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::Version must be semantic and begin with v"
            exit 1
          }

          [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Source commit must be a full lowercase 40-character SHA"
            exit 1
          }

          [[ "${FINAL_IMAGE}" =~ ^ghcr\.io/theriark/nowlert-ce@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Final image must be an immutable nowlert-ce digest"
            exit 1
          }

          [[ -n "${DOKPLOY_URL}" ]] || {
            echo "::error::DOKPLOY_URL is missing"
            exit 1
          }

          [[ -n "${DOKPLOY_API_KEY}" ]] || {
            echo "::error::DOKPLOY_API_KEY is missing"
            exit 1
          }

          git cat-file -e "${SOURCE_COMMIT}^{commit}" || {
            echo "::error::Source commit does not exist in this repository"
            exit 1
          }

          if git show-ref --verify --quiet "refs/tags/${VERSION}"; then
            echo "::error::Tag ${VERSION} already exists"
            exit 1
          fi

          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::GitHub Release ${VERSION} already exists"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify protected release publication credential
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail

          [[ -n "${GH_TOKEN}" ]] || {
            echo "::error::production-reference secret CE_RELEASE_TOKEN is missing"
            exit 1
          }

          resolved_repository="$(
            gh api "repos/${GITHUB_REPOSITORY}" --jq '.full_name'
          )"
          [[ "${resolved_repository,,}" == "${GITHUB_REPOSITORY,,}" ]] || {
            echo "::error::CE_RELEASE_TOKEN cannot access ${GITHUB_REPOSITORY}"
            exit 1
          }

      - name: Verify live CE Production Reference digest
        shell: bash
        run: |
          set -euo pipefail

          python .github/scripts/dokploy_release.py assert-image \
            --application-id="${CE_PRODREF_APPLICATION_ID}" \
            --image "${FINAL_IMAGE}"

      - name: Validate promotion chain and create release records
        shell: bash
        run: |
          set -euo pipefail

          python .github/scripts/finalize_release.py \
            --version "${VERSION}" \
            --final-image "${FINAL_IMAGE}" \
            --source-commit "${SOURCE_COMMIT}" \
            --development-run "${DEVELOPMENT_RUN_ID}" \
            --stage-run "${STAGE_PROMOTION_RUN_ID}" \
            --production-reference-run "${PRODUCTION_REFERENCE_RUN_ID}" \
            --qa-schedule-deployment-id "${QA_SCHEDULE_DEPLOYMENT_ID}" \
            --release-notes "${RELEASE_NOTES}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Configure AWS credentials for CE ledger
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: arn:aws:iam::845958214943:role/GitHubActions-NowlertCE-LedgerWriter
          aws-region: eu-west-1
          role-session-name: nowlert-ce-release-${{ github.run_id }}
          role-duration-seconds: 900
          allowed-account-ids: "845958214943"
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Confirm CE Production Reference ledger approval
        shell: bash
        run: |
          set -euo pipefail

          python .github/scripts/ledger.py assert-current \
            --environment production-reference \
            --image "${FINAL_IMAGE}" \
            --source-commit "${SOURCE_COMMIT}" \
            --promotion-run "${PRODUCTION_REFERENCE_RUN_ID}"

      - name: Publish annotated CE tag, GitHub Release, and ledger record
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CE_RELEASE_TOKEN }}
        run: |
          set -Eeuo pipefail

          tag_ref_created=false

          cleanup_failed_publication() {
            status=$?
            trap - ERR

            if [[ "${tag_ref_created}" == "true" ]]; then
              echo "::warning::Release publication failed; removing partial GitHub release state"

              if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
                gh release delete "${VERSION}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --yes || true
              fi

              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/git/refs/tags/${VERSION}" \
                >/dev/null 2>&1 || true
            fi

            exit "${status}"
          }

          trap cleanup_failed_publication ERR

          tag_message="$(printf '%s\n\n%s\n\n%s' \
            "Nowlert CE ${VERSION}" \
            "Image: ${FINAL_IMAGE}" \
            "Production Reference run: ${PRODUCTION_REFERENCE_RUN_ID}")"

          tag_object_sha="$(
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/git/tags" \
              -f tag="${VERSION}" \
              -f message="${tag_message}" \
              -f object="${SOURCE_COMMIT}" \
              -f type="commit" \
              -f 'tagger[name]=github-actions[bot]' \
              -f 'tagger[email]=41898282+github-actions[bot]@users.noreply.github.com' \
              --jq '.sha'
          )" || {
            echo "::error::CE_RELEASE_TOKEN must have Contents: write and Workflows: write for this repository"
            exit 1
          }

          [[ "${tag_object_sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::GitHub did not return a valid annotated tag object SHA"
            exit 1
          }

          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${VERSION}" \
            -f sha="${tag_object_sha}" \
            >/dev/null || {
              echo "::error::CE_RELEASE_TOKEN could not create refs/tags/${VERSION}; verify Workflows: write"
              exit 1
            }
          tag_ref_created=true

          gh release create "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Nowlert CE ${VERSION}" \
            --notes-file release-summary.md \
            release-manifest.json \
            release-summary.md

          python .github/scripts/ledger.py release \
            --manifest release-manifest.json \
            --output-path "${VERSION}-ledger-record.json"

          trap - ERR

      - name: Upload CE release evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: nowlert-ce-${{ inputs.version }}-release-record
          if-no-files-found: error
          retention-days: 90
          path: |
            release-manifest.json
            release-summary.md
            ${{ inputs.version }}-ledger-record.json

      - name: Record successful CE release finalization
        shell: bash
        run: |
          {
            echo "## CE release finalized"
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- Source commit: \`${SOURCE_COMMIT}\`"
            echo "- Final image: \`${FINAL_IMAGE}\`"
            echo "- Development run: \`${DEVELOPMENT_RUN_ID}\`"
            echo "- Stage promotion run: \`${STAGE_PROMOTION_RUN_ID}\`"
            echo "- Production Reference run: \`${PRODUCTION_REFERENCE_RUN_ID}\`"
            echo "- VM-13 schedule deployment: \`${QA_SCHEDULE_DEPLOYMENT_ID}\`"
            echo "- Ledger key: \`${{ steps.publish.outputs.key }}\`"
            echo "- Ledger version: \`${{ steps.publish.outputs.version_id }}\`"
            echo "- Rebuild performed: no"
            echo "- Deployment performed: no"
          } >> "${GITHUB_STEP_SUMMARY}"
