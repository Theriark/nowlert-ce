name: Finalize CE Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v3.1.6"
        required: true
        type: string
      final_image:
        description: "Final immutable CE image digest"
        required: true
        type: string
      source_commit:
        description: "Original full source commit SHA"
        required: true
        type: string
      development_run_id:
        description: "Successful development Continuous Integration run ID"
        required: true
        type: string
      stage_promotion_run_id:
        description: "Successful CE Stage promotion run ID"
        required: true
        type: string
      release_notes:
        description: "Human-readable release notes"
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write
  packages: write

concurrency:
  group: nowlert-ce-release-finalization
  cancel-in-progress: false

jobs:
  finalize:
    name: Validate and publish CE release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: stage

    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      VERSION: ${{ inputs.version }}
      FINAL_IMAGE: ${{ inputs.final_image }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      DEVELOPMENT_RUN_ID: ${{ inputs.development_run_id }}
      STAGE_PROMOTION_RUN_ID: ${{ inputs.stage_promotion_run_id }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      CE_STAGE_APPLICATION_ID: x9zOew6dmrn-jmcnFbllk

    steps:
      - name: Checkout release workflow code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release inputs and repository state
        shell: bash
        run: |
          set -euo pipefail

          [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::Version must be semantic and begin with v"
            exit 1
          }

          [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Source commit must be a full lowercase 40-character SHA"
            exit 1
          }

          [[ "${FINAL_IMAGE}" =~ ^ghcr\.io/theriark/nowlert-ce@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Final image must be an immutable nowlert-ce digest"
            exit 1
          }

          [[ -n "${DOKPLOY_URL}" ]] || {
            echo "::error::DOKPLOY_URL is missing"
            exit 1
          }

          [[ -n "${DOKPLOY_API_KEY}" ]] || {
            echo "::error::DOKPLOY_API_KEY is missing"
            exit 1
          }

          git cat-file -e "${SOURCE_COMMIT}^{commit}" || {
            echo "::error::Source commit does not exist in this repository"
            exit 1
          }

          [[ "${GITHUB_REF}" == "refs/heads/stage" ]] || {
            echo "::error::Release finalization must be launched from stage"
            exit 1
          }

          git fetch origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/stage:refs/remotes/origin/stage

          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          STAGE_SHA="$(git rev-parse refs/remotes/origin/stage)"

          [[ "${SOURCE_COMMIT}" == "${STAGE_SHA}" ]] || {
            echo "::error::Release source ${SOURCE_COMMIT} is not current Stage ${STAGE_SHA}"
            exit 1
          }

          if [[ "${MAIN_SHA}" != "${SOURCE_COMMIT}" ]]; then
            git merge-base --is-ancestor "${MAIN_SHA}" "${SOURCE_COMMIT}" || {
              echo "::error::main cannot fast-forward from ${MAIN_SHA} to Stage-approved source ${SOURCE_COMMIT}"
              exit 1
            }
          fi

          SOURCE_VERSION="$(
            git show "${SOURCE_COMMIT}:src/version.py" |
              sed -n 's/^VERSION = "\([^"[:space:]]*\)"$/\1/p'
          )"
          [[ -n "${SOURCE_VERSION}" ]] || {
            echo "::error::Could not determine source version for ${SOURCE_COMMIT}"
            exit 1
          }

          [[ "${VERSION}" == "v${SOURCE_VERSION}" ]] || {
            echo "::error::Release tag ${VERSION} does not match source version v${SOURCE_VERSION}"
            exit 1
          }

          git cat-file -e "${SOURCE_COMMIT}:docs/releases/${VERSION}.md" || {
            echo "::error::Release notes docs/releases/${VERSION}.md are missing from ${SOURCE_COMMIT}"
            exit 1
          }

          git cat-file -e "${SOURCE_COMMIT}:docs/${VERSION}-qa-checklist.md" || {
            echo "::error::QA checklist docs/${VERSION}-qa-checklist.md is missing from ${SOURCE_COMMIT}"
            exit 1
          }

          if git show-ref --verify --quiet "refs/tags/${VERSION}"; then
            echo "::error::Tag ${VERSION} already exists"
            exit 1
          fi

          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::GitHub Release ${VERSION} already exists"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify live CE Stage digest
        shell: bash
        run: |
          set -euo pipefail

          python .github/scripts/dokploy_release.py assert-image \
            --application-id="${CE_STAGE_APPLICATION_ID}" \
            --image "${FINAL_IMAGE}"

      - name: Validate Development and Stage promotion chain
        shell: bash
        run: |
          set -euo pipefail

          python .github/scripts/finalize_release.py \
            --version "${VERSION}" \
            --final-image "${FINAL_IMAGE}" \
            --source-commit "${SOURCE_COMMIT}" \
            --development-run "${DEVELOPMENT_RUN_ID}" \
            --stage-run "${STAGE_PROMOTION_RUN_ID}" \
            --release-notes "${RELEASE_NOTES}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Configure AWS credentials for CE ledger
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::845958214943:role/GitHubActions-NowlertCE-LedgerWriter
          aws-region: eu-west-1
          role-session-name: nowlert-ce-release-${{ github.run_id }}
          role-duration-seconds: 900
          allowed-account-ids: "845958214943"
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Confirm CE Stage ledger approval
        shell: bash
        run: |
          set -euo pipefail

          python .github/scripts/ledger.py assert-current \
            --environment stage \
            --image "${FINAL_IMAGE}" \
            --source-commit "${SOURCE_COMMIT}" \
            --promotion-run "${STAGE_PROMOTION_RUN_ID}"

      - name: Advance main to Stage-approved source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          CURRENT_MAIN_SHA="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              --jq '.object.sha'
          )"
          CURRENT_STAGE_SHA="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/stage" \
              --jq '.object.sha'
          )"

          [[ "${CURRENT_STAGE_SHA}" == "${SOURCE_COMMIT}" ]] || {
            echo "::error::Stage moved during finalization: ${CURRENT_STAGE_SHA}, expected ${SOURCE_COMMIT}"
            exit 1
          }

          if [[ "${CURRENT_MAIN_SHA}" != "${SOURCE_COMMIT}" ]]; then
            COMPARE="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/compare/${CURRENT_MAIN_SHA}...${SOURCE_COMMIT}"
            )"
            STATUS="$(jq -r '.status' <<<"${COMPARE}")"
            BEHIND_BY="$(jq -r '.behind_by' <<<"${COMPARE}")"

            [[ "${BEHIND_BY}" == "0" && "${STATUS}" == "ahead" ]] || {
              echo "::error::main cannot fast-forward from ${CURRENT_MAIN_SHA} to ${SOURCE_COMMIT} (status=${STATUS}, behind_by=${BEHIND_BY})"
              exit 1
            }

            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/main" \
              -f sha="${SOURCE_COMMIT}" \
              -F force=false \
              >/dev/null
          fi

          MAIN_SHA=""
          for attempt in {1..15}; do
            MAIN_SHA="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
                --jq '.object.sha'
            )"

            if [[ "${MAIN_SHA}" == "${SOURCE_COMMIT}" ]]; then
              break
            fi

            echo "Waiting for main ref propagation (${attempt}/15): ${MAIN_SHA}"
            sleep 2
          done

          [[ "${MAIN_SHA}" == "${SOURCE_COMMIT}" ]] || {
            echo "::error::main branch is ${MAIN_SHA}, expected ${SOURCE_COMMIT}"
            exit 1
          }

          echo "Main branch now references Stage-approved source ${MAIN_SHA}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install registry copy tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Publish stable aliases without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION="${VERSION#v}"

          skopeo copy --all --preserve-digests \
            "docker://${FINAL_IMAGE}" \
            "docker://ghcr.io/theriark/nowlert-ce:${RELEASE_VERSION}"

          skopeo copy --all --preserve-digests \
            "docker://${FINAL_IMAGE}" \
            "docker://ghcr.io/theriark/nowlert-ce:latest"

          skopeo copy --all --preserve-digests \
            "docker://${FINAL_IMAGE}" \
            "docker://docker.io/theriark/nowlert-ce:${RELEASE_VERSION}"

          skopeo copy --all --preserve-digests \
            "docker://${FINAL_IMAGE}" \
            "docker://docker.io/theriark/nowlert-ce:latest"

      - name: Verify all stable aliases use the approved digest
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION="${VERSION#v}"
          EXPECTED_DIGEST="${FINAL_IMAGE##*@}"

          for image in \
            "ghcr.io/theriark/nowlert-ce:${RELEASE_VERSION}" \
            "ghcr.io/theriark/nowlert-ce:latest" \
            "docker.io/theriark/nowlert-ce:${RELEASE_VERSION}" \
            "docker.io/theriark/nowlert-ce:latest"
          do
            actual="$(
              skopeo inspect \
                --format '{{.Digest}}' \
                "docker://${image}"
            )"

            [[ "${actual}" == "${EXPECTED_DIGEST}" ]] || {
              echo "::error::${image} resolved to ${actual}; expected ${EXPECTED_DIGEST}"
              exit 1
            }

            echo "PASS: ${image} -> ${actual}"
          done

      - name: Publish annotated CE tag, GitHub Release, and ledger record
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          tag_ref_created=false

          cleanup_failed_publication() {
            status=$?
            trap - ERR

            if [[ "${tag_ref_created}" == "true" ]]; then
              echo "::warning::Release publication failed; removing partial GitHub release state"

              if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
                gh release delete "${VERSION}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --yes || true
              fi

              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/git/refs/tags/${VERSION}" \
                >/dev/null 2>&1 || true
            fi

            exit "${status}"
          }

          trap cleanup_failed_publication ERR

          tag_message="$(printf '%s\n\n%s\n\n%s' \
            "Nowlert CE ${VERSION}" \
            "Image: ${FINAL_IMAGE}" \
            "Stage promotion run: ${STAGE_PROMOTION_RUN_ID}")"

          tag_object_sha="$(
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/git/tags" \
              -f tag="${VERSION}" \
              -f message="${tag_message}" \
              -f object="${SOURCE_COMMIT}" \
              -f type="commit" \
              -f 'tagger[name]=github-actions[bot]' \
              -f 'tagger[email]=41898282+github-actions[bot]@users.noreply.github.com' \
              --jq '.sha'
          )" || {
            echo "::error::GITHUB_TOKEN could not create the annotated release tag"
            exit 1
          }

          [[ "${tag_object_sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::GitHub did not return a valid annotated tag object SHA"
            exit 1
          }

          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${VERSION}" \
            -f sha="${tag_object_sha}" \
            >/dev/null || {
              echo "::error::GITHUB_TOKEN could not create refs/tags/${VERSION}"
              exit 1
            }
          tag_ref_created=true

          gh release create "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Nowlert CE ${VERSION}" \
            --notes-file release-summary.md \
            release-manifest.json \
            release-summary.md

          python .github/scripts/ledger.py release \
            --manifest release-manifest.json \
            --output-path "${VERSION}-ledger-record.json"

          trap - ERR

      - name: Upload CE release evidence artifact
        uses: actions/upload-artifact@v7
        with:
          name: nowlert-ce-${{ inputs.version }}-release-record
          if-no-files-found: error
          retention-days: 90
          path: |
            release-manifest.json
            release-summary.md
            ${{ inputs.version }}-ledger-record.json

      - name: Record successful CE release finalization
        shell: bash
        run: |
          RELEASE_VERSION="${VERSION#v}"
          {
            echo "## CE release finalized"
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- Source commit: \`${SOURCE_COMMIT}\`"
            echo "- Final image: \`${FINAL_IMAGE}\`"
            echo "- Development run: \`${DEVELOPMENT_RUN_ID}\`"
            echo "- Stage promotion run: \`${STAGE_PROMOTION_RUN_ID}\`"
            echo "- Main branch: \`${SOURCE_COMMIT}\`"
            echo "- GHCR aliases: \`${RELEASE_VERSION}\`, \`latest\`"
            echo "- Docker Hub aliases: \`${RELEASE_VERSION}\`, \`latest\`"
            echo "- Notification delivery tests during Stage promotion: disabled"
            echo "- Ledger key: \`${{ steps.publish.outputs.key }}\`"
            echo "- Ledger version: \`${{ steps.publish.outputs.version_id }}\`"
            echo "- Image rebuild performed: no"
            echo "- Rebuild performed: no"
            echo "- Deployment performed: no"
          } >> "${GITHUB_STEP_SUMMARY}"
