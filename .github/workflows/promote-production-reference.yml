name: Promote to Production Reference

on:
  workflow_dispatch:
    inputs:
      ce_image:
        description: "Stage-approved immutable CE image"
        required: true
        type: string
      ee_image:
        description: "Stage-approved immutable EE image"
        required: true
        type: string
      stage_promotion_run:
        description: "URL or ID of the successful Stage promotion run"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nowlert-production-reference-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Promote Stage-approved images to Production Reference
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production-reference

    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      CE_STAGE_APPLICATION_ID: nowlert-ce-nowlertcestage-suk6ln
      EE_STAGE_APPLICATION_ID: nowlert-ee-eenowlertstage-xmdm85
      CE_PRODREF_APPLICATION_ID: nowlert-ce-cenowlertproduction-zhxtm9
      EE_PRODREF_APPLICATION_ID: nowlert-ee-eenowlertproduction-mxpv7g
      PRODREF_SMOKE_SCHEDULE_ID: ${{ vars.PRODREF_SMOKE_SCHEDULE_ID }}

    steps:
      - name: Checkout pipeline code
        uses: actions/checkout@v7

      - name: Verify protected pipeline configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${DOKPLOY_URL}" ]] || { echo "::error::DOKPLOY_URL is missing"; exit 1; }
          [[ -n "${DOKPLOY_API_KEY}" ]] || { echo "::error::DOKPLOY_API_KEY is missing"; exit 1; }
          [[ -n "${PRODREF_SMOKE_SCHEDULE_ID}" ]] || {
            echo "::error::Repository variable PRODREF_SMOKE_SCHEDULE_ID is missing"
            exit 1
          }

      - name: Confirm CE image is currently approved in Stage
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/dokploy_release.py assert-image \
            --application-id "${CE_STAGE_APPLICATION_ID}" \
            --image "${{ inputs.ce_image }}"

      - name: Confirm EE image is currently approved in Stage
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/dokploy_release.py assert-image \
            --application-id "${EE_STAGE_APPLICATION_ID}" \
            --image "${{ inputs.ee_image }}"

      - name: Promote CE to Production Reference
        id: ce
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/dokploy_release.py deploy \
            --application-id "${CE_PRODREF_APPLICATION_ID}" \
            --image "${{ inputs.ce_image }}" \
            --health-url https://ce-prod.nowlert.theriark.com/api/health \
            --title "Production Reference promotion ${{ github.run_id }}" \
            --description "Stage run: ${{ inputs.stage_promotion_run }}" \
            --noop-ok

      - name: Promote EE to Production Reference
        id: ee
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/dokploy_release.py deploy \
            --application-id "${EE_PRODREF_APPLICATION_ID}" \
            --image "${{ inputs.ee_image }}" \
            --health-url https://ee-prod.nowlert.theriark.com/api/health \
            --title "Production Reference promotion ${{ github.run_id }}" \
            --description "Stage run: ${{ inputs.stage_promotion_run }}" \
            --noop-ok

      - name: Run official Production Reference smoke on VM-13
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/dokploy_release.py run-schedule \
            --schedule-id "${PRODREF_SMOKE_SCHEDULE_ID}" \
            --success-marker "PRODUCTION REFERENCE POST-PROMOTION SMOKE PASSED" \
            --timeout 1800

      - name: Record successful Production Reference promotion
        shell: bash
        run: |
          {
            echo "## Production Reference promotion passed"
            echo
            echo "- CE image: \`${{ inputs.ce_image }}\`"
            echo "- EE image: \`${{ inputs.ee_image }}\`"
            echo "- Stage promotion run: ${{ inputs.stage_promotion_run }}"
            echo "- Production Reference smoke: \`${{ steps.smoke.outputs.deployment_id }}\`"
            echo "- Rebuild performed: no"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Roll back EE after a failed gate
        if: ${{ failure() && steps.ee.outputs.previous_image != '' }}
        continue-on-error: true
        shell: bash
        run: |
          python .github/scripts/dokploy_release.py deploy \
            --application-id "${EE_PRODREF_APPLICATION_ID}" \
            --image "${{ steps.ee.outputs.previous_image }}" \
            --health-url https://ee-prod.nowlert.theriark.com/api/health \
            --title "Automatic Production Reference rollback ${{ github.run_id }}" \
            --description "A Production Reference promotion or smoke gate failed" \
            --allow-mutable \
            --noop-ok

      - name: Roll back CE after a failed gate
        if: ${{ failure() && steps.ce.outputs.previous_image != '' }}
        continue-on-error: true
        shell: bash
        run: |
          python .github/scripts/dokploy_release.py deploy \
            --application-id "${CE_PRODREF_APPLICATION_ID}" \
            --image "${{ steps.ce.outputs.previous_image }}" \
            --health-url https://ce-prod.nowlert.theriark.com/api/health \
            --title "Automatic Production Reference rollback ${{ github.run_id }}" \
            --description "A Production Reference promotion or smoke gate failed" \
            --allow-mutable \
            --noop-ok
