name: Docker Release Aliases

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing stable release tag, for example v3.1.0"
        required: true
        type: string
      final_image:
        description: "Production Reference-approved immutable GHCR image"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish-aliases:
    runs-on: ubuntu-latest

    env:
      TAG: ${{ inputs.tag }}
      FINAL_IMAGE: ${{ inputs.final_image }}

    steps:
      - name: Verify release repository identity
        shell: bash
        run: |
          set -euo pipefail

          [[ "${GITHUB_REPOSITORY,,}" == "theriark/nowlert-ce" ]] || {
            echo "::error::Stable publication is allowed only from Theriark/nowlert-ce"
            exit 1
          }

          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || {
            echo "::error::Docker release aliases must be launched from main"
            exit 1
          }

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify tag, main, version, and immutable image
        id: release
        shell: bash
        run: |
          set -euo pipefail

          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Release tag must match vMAJOR.MINOR.PATCH"
            exit 1
          }

          [[ "${FINAL_IMAGE}" =~ ^ghcr\.io/theriark/nowlert-ce@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::final_image must be an immutable Nowlert CE GHCR digest"
            exit 1
          }

          git fetch origin \
            +refs/heads/main:refs/remotes/origin/main

          TAG_SHA="$(git rev-list -n 1 "${TAG}")"
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          HEAD_SHA="$(git rev-parse HEAD)"

          [[ "${TAG_SHA}" == "${HEAD_SHA}" ]] || {
            echo "::error::Checked-out source does not match ${TAG}"
            exit 1
          }

          [[ "${TAG_SHA}" == "${MAIN_SHA}" ]] || {
            echo "::error::Release tag ${TAG} does not point at current main"
            exit 1
          }

          VERSION="${TAG#v}"
          APP_VERSION="$(
            sed -n 's/^VERSION = "\([^"]*\)"/\1/p' src/version.py
          )"

          [[ "${APP_VERSION}" == "${VERSION}" ]] || {
            echo "::error::Application version ${APP_VERSION} does not match ${TAG}"
            exit 1
          }

          EXPECTED_DIGEST="${FINAL_IMAGE##*@}"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "expected_digest=${EXPECTED_DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install registry copy tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Publish stable aliases without rebuilding
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          skopeo copy --all --preserve-digests \
            "docker://${FINAL_IMAGE}" \
            "docker://ghcr.io/theriark/nowlert-ce:${VERSION}"

          skopeo copy --all --preserve-digests \
            "docker://${FINAL_IMAGE}" \
            "docker://ghcr.io/theriark/nowlert-ce:latest"

          skopeo copy --all --preserve-digests \
            "docker://${FINAL_IMAGE}" \
            "docker://docker.io/theriark/nowlert-ce:${VERSION}"

          skopeo copy --all --preserve-digests \
            "docker://${FINAL_IMAGE}" \
            "docker://docker.io/theriark/nowlert-ce:latest"

      - name: Verify all stable aliases use the approved digest
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_DIGEST: ${{ steps.release.outputs.expected_digest }}
        run: |
          set -euo pipefail

          for image in \
            "ghcr.io/theriark/nowlert-ce:${VERSION}" \
            "ghcr.io/theriark/nowlert-ce:latest" \
            "docker.io/theriark/nowlert-ce:${VERSION}" \
            "docker.io/theriark/nowlert-ce:latest"
          do
            actual="$(
              skopeo inspect \
                --format '{{.Digest}}' \
                "docker://${image}"
            )"

            [[ "${actual}" == "${EXPECTED_DIGEST}" ]] || {
              echo "::error::${image} resolved to ${actual}; expected ${EXPECTED_DIGEST}"
              exit 1
            }

            echo "PASS: ${image} -> ${actual}"
          done

      - name: Record immutable release alias publication
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_DIGEST: ${{ steps.release.outputs.expected_digest }}
        run: |
          {
            echo "## Stable CE image aliases published"
            echo
            echo "- Tag: \`${TAG}\`"
            echo "- Source image: \`${FINAL_IMAGE}\`"
            echo "- Digest: \`${EXPECTED_DIGEST}\`"
            echo "- Image rebuild performed: no"
          } >> "${GITHUB_STEP_SUMMARY}"
